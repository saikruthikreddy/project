name: Build and Deploy to Azure

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'azure_functions/**'

jobs:
  # Job 1: Check for dependency changes.
  # This job runs on every push and determines if the base image needs to be rebuilt.
  check-for-changes:
    runs-on: ubuntu-latest
    outputs:
      build_base: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          # We need to fetch the history to compare file changes
          fetch-depth: 2

      - name: Check for dependency file changes
        id: changed-files
        uses: tj-actions/changed-files@v44 # Using a dedicated action for reliability
        with:
          files: |
            requirements-azure.txt
            base.Dockerfile

  # Job 2: Build the base image conditionally.
  # This job only runs if the first job detected a change.
  build-base-image:
    needs: check-for-changes
    if: needs.check-for-changes.outputs.build_base == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v3

      - name: 'Login to Azure Container Registry'
        uses: azure/docker-login@v1
        with:
          login-server: gianidevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 'Build and push base image'
        run: |
          echo "Dependency change detected. Building and pushing new base image..."
          docker build -t gianidevacr.azurecr.io/giani-ai-base:latest -f base.Dockerfile .
          docker push gianidevacr.azurecr.io/giani-ai-base:latest

  # Job 3: Build and deploy the application.
  # This job always runs, but it waits for the other two jobs to finish first.
  deploy-application:
    needs: [check-for-changes, build-base-image]
    # This condition is key:
    # It runs if everything so far has succeeded, OR if the 'build-base-image' job was skipped.
    # It will NOT run if 'build-base-image' fails.
    if: success() || needs.build-base-image.result == 'skipped'

    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v3

      - name: 'Login to Azure'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 'Login to Azure Container Registry'
        uses: azure/docker-login@v1
        with:
          login-server: gianidevacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 'Set Version Tag'
        id: set_version
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: 'Build and push application image'
        run: |
          docker build -t gianidevacr.azurecr.io/giani-ai:${{ steps.set_version.outputs.tag }} .
          docker tag gianidevacr.azurecr.io/giani-ai:${{ steps.set_version.outputs.tag }} gianidevacr.azurecr.io/giani-ai:latest

          docker push gianidevacr.azurecr.io/giani-ai:${{ steps.set_version.outputs.tag }}
          docker push gianidevacr.azurecr.io/giani-ai:latest

      - name: 'Deploy to App Service'
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'giani-dev-wa'
          images: 'gianidevacr.azurecr.io/giani-ai:${{ steps.set_version.outputs.tag }}'